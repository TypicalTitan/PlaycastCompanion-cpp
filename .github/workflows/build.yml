name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Version metadata
        shell: pwsh
        run: |
          $project = Get-Content CMakeLists.txt -Raw
          $version = [regex]::Match($project, 'project\(PlaycastCompanion VERSION (\d+\.\d+\.\d+) ').Groups[1].Value
          if (-not $version) { throw 'Could not read the project version' }
          $metadata = (Get-Item build/PlaycastCompanion.exe).VersionInfo
          if ($metadata.ProductVersion -ne $version -or $metadata.FileVersion -ne "$version.0") {
            throw "Executable version differs from CMake: $($metadata.ProductVersion) / $($metadata.FileVersion)"
          }
          $installer = Get-Content installer/installer.nsi -Raw
          $setupVersion = [regex]::Match($installer, '!define APP_VERSION\s+"([^"\r\n]+)"').Groups[1].Value
          if ($setupVersion -ne $version) { throw 'Installer version differs from CMake' }

      - name: Contract tests
        run: ctest --test-dir build --output-on-failure

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/payload | Out-Null
          Copy-Item build/PlaycastCompanion.exe, config.json installer/payload
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PlaycastCompanion-win-x64
          path: build/PlaycastCompanion.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PlaycastCompanion-setup-win-x64
          path: installer/PlaycastCompanionSetup-*.exe
